name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (Node 20)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

  audit:
    name: Audit (Node 20)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: node scripts/ci-audit.js

  test:
    name: Tests (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run all tests
        run: npm test

  build:
    name: Build (Node 20)
    runs-on: ubuntu-latest
    needs: [lint, audit, test]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Scan for hardcoded credentials
        run: |
          node <<'NODE'
          const { execSync } = require('child_process');
          const fs = require('fs');

          const files = execSync(
            "git ls-files '*.js' '*.jsx' '*.ts' '*.cjs' '*.mjs' '*.bat' '*.ps1'",
            { encoding: 'utf8' }
          )
            .split(/\r?\n/)
            .filter(Boolean)
            .filter((file) => !/^(artifacts|dist|releases)\//.test(file));

          const rules = [
            {
              name: 'hardcoded password assignment',
              regex: /(^|[^A-Za-z0-9_])[Pp]assword[A-Za-z0-9_]*\s*[:=]\s*["'][^$"'\r\n]{3,}["']/m,
            },
            {
              name: 'hardcoded token/secret/api key assignment',
              regex: /(^|[^A-Za-z0-9_])(?:token|secret|api[_-]?key)[A-Za-z0-9_]*\s*[:=]\s*["'][^$"'\r\n]{6,}["']/m,
            },
            {
              name: 'literal SFTP_PASSWORD assignment',
              regex: /SFTP_PASSWORD\s*=\s*["']/m,
            },
            {
              name: 'known leaked test secret',
              regex: /Ms19bLsPG/m,
            },
          ];

          const hits = [];
          for (const file of files) {
            const text = fs.readFileSync(file, 'utf8');
            for (const rule of rules) {
              if (rule.regex.test(text)) {
                hits.push(`${file}: ${rule.name}`);
                break;
              }
            }
          }

          if (hits.length > 0) {
            console.error('ERROR: Hardcoded credential detected in tracked source files.');
            for (const hit of hits) console.error(hit);
            process.exit(1);
          }

          console.log('Credential scan passed.');
          NODE

      - name: Build app
        run: npm run build

  build-linux:
    name: Build Linux (AppImage + deb)
    runs-on: ubuntu-latest
    needs: [lint, audit, test]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dpkg-dev rpm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer
        run: npm run build

      - name: Package Linux app
        run: npx electron-builder --linux --config electron-builder.config.js --publish never

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: wattcoin-linux-AppImage
          path: Releases/Wattcoin-Miner-*.AppImage
          if-no-files-found: warn

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: wattcoin-linux-deb
          path: Releases/Wattcoin-Miner-*.deb
          if-no-files-found: warn

  build-windows:
    name: Build Windows (exe)
    runs-on: windows-latest
    needs: [lint, audit, test]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer
        run: npm run build

      - name: Package Windows app
        run: npx electron-builder --win --config electron-builder.config.js --publish never

      - name: Upload .exe installer
        uses: actions/upload-artifact@v4
        with:
          name: wattcoin-windows-exe
          path: Releases/Wattcoin-Miner-Setup-*.exe
          if-no-files-found: warn

  build-macos:
    name: Build macOS (dmg + zip)
    runs-on: macos-latest
    needs: [lint, audit, test]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install dmg-license for DMG build
        run: npm install dmg-license --no-save

      - name: Remove cpu-features (incompatible with Electron 42 V8 on arm64)
        run: rm -rf node_modules/cpu-features

      - name: Build renderer
        run: npm run build

      - name: Package macOS app
        run: npx electron-builder --mac --config electron-builder.config.js --publish never

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: wattcoin-macos-dmg
          path: Releases/Wattcoin-Miner-*.dmg
          if-no-files-found: warn

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: wattcoin-macos-zip
          path: Releases/Wattcoin-Miner-*.zip
          if-no-files-found: warn
