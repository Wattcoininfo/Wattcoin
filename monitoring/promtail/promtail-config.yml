server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: wattcoin-incidents
    static_configs:
      - targets:
          - localhost
        labels:
          job: wattcoin-incidents
          __path__: /var/lib/wattcoin-monitoring/incidents/*.jsonl
    pipeline_stages:
      - json:
          expressions:
            severity: severity
            nodeId: nodeId
            nodeName: nodeName
            type: type
      - labels:
          severity:
          nodeId:
          nodeName:
          type:

  - job_name: wattcoin-abuse-events
    static_configs:
      - targets:
          - localhost
        labels:
          job: wattcoin-abuse-events
          __path__: /var/lib/wattcoin-monitoring/archive/*/abuse-events/*.jsonl
    pipeline_stages:
      - json:
          expressions:
            type: type
            severity: severity
      - labels:
          type:
          severity: